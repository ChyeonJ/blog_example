plugins {
    id 'java'
    id 'org.springframework.boot' version '3.0.2' // 스프링 플러그인 호츌
    id 'io.spring.dependency-management' version '1.1.0' // 의존성 자동관리 플러그인 호출
}

group = 'chyeonj.blogexample'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    testImplementation 'org.springframework.boot:spring-boot-starter-test' //애플리케이션 테스트를 위한 스타터 의존성 Junit, assertJ

    //Mysql
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa' // 스프링 데이터 JPA 사용 DB 상호작용 위한 스타터 의존성
    implementation 'mysql:mysql-connector-java' // MySQL DB와 연결을 위한 JDBC 드라이버
    compileOnly 'org.projectlombok:lombok'  // 애너테이션 라이브러리
    runtimeOnly 'com.mysql:mysql-connector-j'
    annotationProcessor 'org.projectlombok:lombok'

    //타임리프 (Thymeleaf)
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
}

test {
    useJUnitPlatform()
}