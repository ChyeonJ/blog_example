<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>블로그 글 목록</title>
    <link rel="stylesheet" href = "https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css"> <!-- 부투스트랩 웹 애플리케이션 화면을 쉽고 빠르게 만들어주는 라이브러리 -->
</head>
<body>
    <div class="p-5 mb-5 text-center</> bg-light">
        <h1 class="mb-3">My Blog</h1>
        <h4 class="mb-3">블로그에 오신 것을 환영합니다.</h4>
    </div>

    <div class="container">
        <div class="row-6" th:each="item : ${articles}"> <!-- article 개수만큼 반복 th:each -->
            <div class="card">
                <div class="card-header" th:text="${item.id}"> <!-- item의 id 출력-->
                </div>
                <div class = "card-body">
                    <h5 class="cart-title" th:text="${item.title}"></h5>
                    <p class="cart-text" th:text="${item.content}"></p>
                    <a th:href="@{/articles/{id}(id=${item.id})}" class="btn btn-primary">보러 가기</a>
                </div>
            </div>
        </div>
    </div>


</body>
</html>
